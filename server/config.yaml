# EchoSelf GPU Server 配置 (Duix-Avatar)

server:
  host: "0.0.0.0"
  port: 8000

# Duix-Avatar 服务地址
duix:
  # TTS 服务 (Fish Speech)
  tts_url: "http://127.0.0.1:18180"
  # 视频生成服务
  video_url: "http://127.0.0.1:8383"
  # ASR 服务 (可选)
  asr_url: "http://127.0.0.1:10095"

# 数据目录 (与 docker-compose 中的 volumes 对应)
paths:
  # 语音数据目录
  voice_data: "/data/duix_avatar_data/voice/data"
  # 视频数据目录
  video_data: "/data/duix_avatar_data/face2face"
  # 临时文件目录
  temp_dir: "./temp"
  # 输出目录
  output_dir: "./outputs"

# 视频生成参数
video:
  # 超分辨率 (0=关闭, 1=开启)
  chaofen: 0
  # 水印开关 (0=关闭, 1=开启)
  watermark_switch: 0
  # 并行数
  pn: 1

# TTS 参数
tts:
  format: "wav"
  topP: 0.7
  max_new_tokens: 1024
  chunk_length: 100
  repetition_penalty: 1.2
  temperature: 0.7
  streaming: false

# 日志配置
logging:
  level: "INFO"
  file: "./logs/server.log"
